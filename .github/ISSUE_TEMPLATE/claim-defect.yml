name: Claim defect
description: Something in this repository that the live Atlas service does not honour.
labels: ["claim-defect"]
body:
  - type: input
    id: where
    attributes:
      label: Where is the claim?
      description: File and line, or a quote.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What did you observe instead?
      description: Requests and responses help. Never paste a credential.
    validations:
      required: true
